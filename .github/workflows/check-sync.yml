# 两分支同步检查：main 与 offline 的共享文件必须内容一致
# （有意差异除外：capacitor.config.json 的 appId/appName、index.html 的 sync.js 行、sync.js、inbox.md 快照）
# 漂移即失败标红，提醒先 cherry-pick 同步再部署。

name: check-branch-sync

on:
  push:
    branches: [main, offline]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 对比两分支共享文件
        run: |
          SHARED="app.js style.css manifest.json sw.js AGENTS.md package.json .gitignore .vercelignore scripts/export.py scripts/feedback/lib.mjs scripts/feedback/pull.mjs scripts/feedback/close.mjs scripts/feedback/README.md .github/workflows/build-apk.yml .github/workflows/check-sync.yml resources/icon.png"
          DRIFT=$(git diff --name-only origin/main origin/offline -- $SHARED)
          if [ -n "$DRIFT" ]; then
            echo "::error::两分支共享文件漂移："
            echo "::error::$DRIFT"
            echo "请在另一分支执行 git cherry-pick 同步后再部署。"
            exit 1
          fi
          echo "✅ main 与 offline 共享文件一致"
