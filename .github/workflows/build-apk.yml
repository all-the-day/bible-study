# 单一 APK：云同步是运行时可选功能（未启用=纯本地，不再区分安装包变体）
# 仓库只维护 main 分支；构建后滚动发布到 release tag bible-study-main。

name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'style.css'
      - 'index.html'
      - 'sync.js'
      - 'update.js'
      - 'manifest.json'
      - 'sw.js'
      - 'capacitor.config.json'
      - 'package.json'
      - 'resources/**'
      - 'config/**'
      - 'scripts/patch-android.mjs'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0   # 完整历史：release notes 需要 git log

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: 准备 web 资源
        run: |
          mkdir -p www/data/lifereading
          cp index.html app.js style.css manifest.json sw.js sync.js update.js www/
          cp -r icons www/
          # APK 内 manifest 版本用 package.json 值重写（App 内更新检查的本地版本依据）
          VERSION=$(node -p "require('./package.json').version")
          node -e "const fs=require('fs');const f='www/manifest.json';const m=JSON.parse(fs.readFileSync(f));m.version=process.argv[1];fs.writeFileSync(f,JSON.stringify(m,null,2))" "$VERSION"
          echo "APK manifest version: $VERSION"

      - name: 自动递增版本（release 版本与 package.json 相同时 patch+1）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          RELEASE_NAME=$(gh release view bible-study-main --json name -q .name 2>/dev/null || echo "")
          CURRENT=$(echo "$RELEASE_NAME" | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 || echo "")
          if [ "$CURRENT" = "v$VERSION" ]; then
            NEW=$(echo "$VERSION" | awk -F. '{print $1"."$2"."($3+1)}')
            echo "release 已是 v$VERSION，自动递增到 v$NEW"
            node -e "const fs=require('fs');const a=JSON.parse(fs.readFileSync('package.json')),b=JSON.parse(fs.readFileSync('manifest.json'));a.version=process.argv[1];b.version=process.argv[1];fs.writeFileSync('package.json',JSON.stringify(a,null,2)+'\n');fs.writeFileSync('manifest.json',JSON.stringify(b,null,2)+'\n')" "$NEW"
            echo "bumped=true" >> "$GITHUB_ENV"
            echo "NEW_VERSION=$NEW" >> "$GITHUB_ENV"
          else
            echo "release ($CURRENT) 与 package.json ($VERSION) 不同，保持手动版本"
          fi

      - name: 版本一致性守卫（package.json 与 manifest.json）
        run: |
          PKG=$(node -p "require('./package.json').version")
          MAN=$(node -p "require('./manifest.json').version")
          echo "package.json=$PKG manifest.json=$MAN"
          if [ "$PKG" != "$MAN" ]; then
            echo "::error::版本不一致：package.json ($PKG) != manifest.json ($MAN)。App 内更新依赖两者一致，请同步升版本号。"
            exit 1
          fi

      - name: 下载数据（从 Vercel）
        run: |
          BASE="https://bible-study-teal-seven.vercel.app/data"
          for f in books.json bible-text.json bible-notes.json bible-xrefs.json bible-outlines.json; do
            curl -sL "$BASE/$f" -o "www/data/$f"
          done
          for acr in $(python3 -c "import json; print(' '.join(b['acronym'] for b in json.load(open('www/data/books.json'))))"); do
            code=$(curl -sL -w "%{http_code}" -o "www/data/lifereading/$acr.json" "$BASE/lifereading/$acr.json")
            if [ "$code" != "200" ]; then rm -f "www/data/lifereading/$acr.json"; fi
          done
          echo "lifereading 文件数: $(ls www/data/lifereading/ | wc -l)"
          du -sh www/data

      - name: 安装依赖
        run: npm install

      - name: Capacitor add android
        run: npx cap add android

      - name: Capacitor sync
        run: npx cap sync android

      - name: 生成 Android 图标
        run: npx capacitor-assets generate --android

      - name: 注入原生更新插件（patch-android）
        run: node scripts/patch-android.mjs

      - name: 注入固定签名 keystore（保证每次构建签名一致，覆盖安装/App 内更新不丢数据）
        run: |
          mkdir -p "$HOME/.android"
          cp config/android/debug.keystore "$HOME/.android/debug.keystore"
          echo "固定 debug keystore 注入完成（alias=androiddebugkey, storepass=android）"

      - name: 构建 debug APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: bible-study-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: 发布到 GitHub Releases（滚动更新，notes 取最近提交动态生成）
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          TAG="bible-study-main"
          cp android/app/build/outputs/apk/debug/app-debug.apk "bible-study.apk"
          NOTES=$(cat <<EOF
自动构建于 $(TZ='Asia/Shanghai' date '+%Y-%m-%d %H:%M')。

**本版更新（最近提交）：**
$(git log -8 --format='* %s' HEAD)
          EOF
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release delete "$TAG" --yes --cleanup-tag
          fi
          gh release create "$TAG" "bible-study.apk" \
            --title "读经 v${VERSION} · 云同步版" \
            --notes "$NOTES"

      - name: 持久化自动递增的版本号（[skip ci] 防止再次触发构建）
        if: env.bumped == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json manifest.json
          git commit -m "[skip ci] chore: 自动递增版本 v$NEW_VERSION"
          git push origin main
          echo "已推送 v$NEW_VERSION 到 main"
