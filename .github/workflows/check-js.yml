# JS 语法检查：几秒拦下语法错误，不用等 APK 构建跑 5 分钟才发现

name: JS Syntax Check

on:
  push:
    branches: [main]
    paths:
      - 'app.js'
      - 'sync.js'
      - 'manifest.json'
      - 'sw.js'
      - 'scripts/*.js'
      - 'scripts/*.mjs'
      - 'scripts/feedback/*.mjs'

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: node --check 全部 JS
        run: |
          FAIL=0
          for f in app.js sync.js manifest.json sw.js scripts/*.js scripts/*.mjs scripts/feedback/*.mjs; do
            [ -f "$f" ] || continue
            if [ "${f##*.}" = "json" ]; then
              node -e "JSON.parse(require('fs').readFileSync('$f','utf8'))" || FAIL=1
            else
              node --check "$f" || FAIL=1
            fi
            echo "OK $f"
          done
          exit $FAIL
