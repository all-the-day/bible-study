<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <title>读经</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="menuBtn" class="icon-btn" aria-label="菜单">☰</button>
    <div class="crumb">
      <span id="bookName">—</span>
      <span id="chapterLabel">第 — 章</span>
      <button id="prevChBtn" class="crumb-nav">上一章</button>
      <button id="nextChBtn" class="crumb-nav">下一章</button>
    </div>
    <div class="topbar-actions">
      <span id="syncStatus" class="sync-status" title="同步状态">●</span>
      <button id="viewModeBtn" class="top-btn" aria-label="视图模式">双页</button>
      <button id="hideMarksBtn" class="top-btn" aria-label="隐藏注号">隐藏注号</button>
      <button id="studyFullBtn" class="top-btn" aria-label="研读全屏">研读全屏</button>
      <button id="feedbackBtn" class="top-btn" aria-label="反馈">反馈</button>
      <button id="notesBtn" class="icon-btn" aria-label="笔记汇总">✎</button>
    </div>
  </header>

  <div class="layout">
    <aside class="nav-col" id="navCol">
      <div class="nav-search">
        <input id="bookSearch" type="text" placeholder="搜索书卷…" autocomplete="off">
      </div>
      <div class="nav-list" id="bookList"></div>
      <div class="nav-chapters" id="chapterList"></div>
    </aside>

    <main class="text-col" id="textCol">
      <div id="chapterTheme" class="chapter-theme"></div>
      <div id="verseContainer" class="verses"></div>
    </main>

    <aside class="study-col" id="studyCol">
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="study-tabs" id="studyTabs">
        <button class="study-tab active" data-tab="notes">注解</button>
        <button class="study-tab" data-tab="lifereading">生命读经</button>
        <button class="study-tab" data-tab="mynotes">我的笔记</button>
      </div>
      <div class="study-body" id="studyBody"></div>
    </aside>
  </div>

  <div id="floatTool" class="floattool" hidden></div>
  <div id="markTool" class="marktool" hidden></div>
  <div id="noteModal" class="notemodal" hidden>
    <div class="notemodal-card">
      <div class="notemodal-title">笔记</div>
      <textarea id="noteTextarea" placeholder="输入笔记内容…" rows="5"></textarea>
      <div class="notemodal-actions">
        <button id="noteCancel" class="popup-btn">取消</button>
        <button id="noteSave" class="popup-btn primary">保存</button>
      </div>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="popup" class="popup" hidden>
    <div class="popup-header">
      <button id="popupBack" class="icon-btn back-btn" hidden>←</button>
      <span id="popupTitle"></span>
      <button id="popupClose" class="icon-btn">×</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
  </div>

  <!-- 移动端底部导航：读经 / 研读 单视图切换 -->
  <nav class="mobile-nav" id="mobileNav" aria-label="视图切换">
    <button class="mnav-btn active" data-view="read">读经</button>
    <button class="mnav-btn" data-view="study">研读</button>
  </nav>

  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
