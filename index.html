<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#667eea">
  <title>读经</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="topbar">
    <button id="homeBtn" class="icon-btn" aria-label="首页">⌂</button>
    <button id="menuBtn" class="icon-btn" aria-label="菜单">☰</button>
    <div class="crumb">
      <span id="bookName">—</span>
      <span id="chapterLabel">第 — 章</span>
      <button id="prevChBtn" class="crumb-nav">上一章</button>
      <button id="nextChBtn" class="crumb-nav">下一章</button>
    </div>
    <div class="topbar-actions">
      <div class="mode-pill" id="modePill">
        <button class="mode-pill-btn active" data-view="read">读经</button>
        <button class="mode-pill-btn" data-view="study">研读</button>
      </div>
      <button id="viewModeBtn" class="top-btn" aria-label="视图模式">双页</button>
      <button id="hideMarksBtn" class="top-btn" aria-label="隐藏注号">隐藏注号</button>
      <button id="studyFullBtn" class="top-btn" aria-label="研读全屏">研读全屏</button>
      <button id="feedbackBtn" class="top-btn" aria-label="反馈">反馈</button>
      <button id="notesBtn" class="icon-btn" aria-label="笔记汇总">✎</button>
    </div>
    <button id="settingsBtn" class="icon-btn" aria-label="设置">⚙️</button>
  </header>

  <div class="layout">
    <aside class="nav-col" id="navCol">
      <div class="nav-search">
        <input id="bookSearch" type="text" placeholder="搜索书卷…" autocomplete="off">
      </div>
      <div class="nav-list" id="bookList"></div>
      <div class="nav-chapters" id="chapterList"></div>
      <!-- 生命读经模块左栏：卷条 + 篇目列表（body-mod-lifereading 时显示） -->
      <div class="lr-nav" id="lrNav"></div>
      <!-- 书报模块左栏：辑条 + 书列表（body-mod-books 时显示） -->
      <div class="bk-nav" id="bookNav"></div>
    </aside>

    <main class="text-col" id="textCol">
      <div id="chapterTheme" class="chapter-theme"></div>
      <div id="verseContainer" class="verses"></div>
      <!-- 生命读经模块主区（body-mod-lifereading 时显示） -->
      <div id="lrMain" class="lr-main"></div>
      <!-- 书报模块主区（body-mod-books 时显示） -->
      <div id="bookMain" class="bk-main"></div>
    </main>

    <aside class="study-col" id="studyCol">
      <div class="resize-handle" id="resizeHandle"></div>
      <div class="study-tabs" id="studyTabs">
        <button class="study-tab active" data-tab="notes">注解</button>
        <button class="study-tab" data-tab="lifereading">生命读经</button>
        <button class="study-tab" data-tab="mynotes">我的笔记</button>
      </div>
      <div class="study-body" id="studyBody"></div>
      <!-- 生命读经模块右栏：纲目|笔记（body-mod-lifereading 时显示） -->
      <div class="lr-side" id="lrSide"></div>
      <!-- 书报模块右栏：章列表|笔记（body-mod-books 时显示） -->
      <div class="bk-side" id="bookSide"></div>
    </aside>
  </div>

  <!-- 首页：启动默认视图，合集块网格（读经/生命读经/我的笔记；晨兴/书报数据到位后加块）
       显示由 body.home 类控制（body:not(.home) #homeView 隐藏） -->
  <div id="homeView" class="home-view">
    <div class="home-wrap">
      <div class="home-search">
        <input id="homeSearch" placeholder="搜索书卷 / 章（如 创24）/ 生命读经篇目 / 笔记…" autocomplete="off">
        <div id="homeSearchResults"></div>
      </div>
      <div class="home-grid" id="homeGrid"></div>
    </div>
  </div>

  <div id="floatTool" class="floattool" hidden></div>
  <div id="markTool" class="marktool" hidden></div>
  <div id="noteModal" class="notemodal" hidden>
    <div class="notemodal-card">
      <div class="notemodal-title">笔记</div>
      <textarea id="noteTextarea" placeholder="输入笔记内容…" rows="5"></textarea>
      <div class="notemodal-actions">
        <button id="noteCancel" class="popup-btn">取消</button>
        <button id="noteSave" class="popup-btn primary">保存</button>
      </div>
    </div>
  </div>
  <div id="overlay" class="overlay" hidden></div>
  <div id="popup" class="popup" hidden>
    <div class="popup-header">
      <button id="popupBack" class="icon-btn back-btn" hidden>←</button>
      <span id="popupTitle"></span>
      <button id="popupClose" class="icon-btn">×</button>
    </div>
    <div class="popup-body" id="popupBody"></div>
  </div>

  <!-- 检查更新弹窗（独立 modal，下载过程不随弹窗栈关闭） -->
  <div id="updateModal" class="notemodal" hidden>
    <div class="notemodal-card">
      <div class="notemodal-title">检查更新</div>
      <div id="updateStatus" class="update-status">检查中…</div>
      <div id="updateBody" class="update-body"></div>
      <div id="updateProgress" class="update-progress" hidden>
        <div class="bar"><div class="fill" id="updateFill"></div></div>
        <span id="updatePercent" class="update-percent">0%</span>
      </div>
      <div class="notemodal-actions">
        <button id="updateCancel" class="popup-btn">关闭</button>
        <button id="updateAction" class="popup-btn primary" hidden>下载并安装</button>
      </div>
    </div>
  </div>

  <!-- 移动端底部导航：读经模式翻页（研读模式隐藏，沉浸阅读） -->
  <nav class="mobile-nav" id="mobileNav" aria-label="章节翻页">
    <button class="mnav-btn" id="mPrevBtn" aria-label="上一章">‹ 上一章</button>
    <button class="mnav-btn" id="mNextBtn" aria-label="下一章">下一章 ›</button>
  </nav>

  <script src="sync.js"></script>
  <script src="update.js"></script>
  <script src="app.js"></script>
</body>
</html>
